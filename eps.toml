[package]
name        = "notes"
version     = "0.1.0"
description = "Personal notes harness with full CRUD and search"
authors     = ["nickagliano"]
license     = "MIT"
platforms   = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
repository  = "https://github.com/nickagliano/notes"

[eps]
customization_guide = "CUSTOMIZE.md"

[service]
enabled = true
start   = "HOST=$(tailscale ip -4) ./serve.sh"
port    = 3002

[ports]
# app_color: primary accent color for the UI.
# Any valid CSS hex color. Default is indigo (#7c6af7).
# Set APP_COLOR env var to override.
app_color = "#7c6af7"
